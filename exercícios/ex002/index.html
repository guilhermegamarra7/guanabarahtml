<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linhas</h1>
    <hr>
    <p>Você pode escrever um <br>
        parágrafo de qualquer <br>
        jeito. Basta colocar <br>
        tudo no meio de um <br>
        par de tags.
    </p>
    <p>Vamos adicionar alguns símbolos especiais: <br>
        &reg; <br>
        &copy; <br>
        &trade; <br>
        &euro; <br>
        &pound; <br>
        &yen; <br>
        &cent; <br>
        &Delta; <br>
        &uarr; <br>
        &larr; <br>
        &rarr; <br>
        &darr; </p>
    <p>Vamos adicionar alguns emojis: <br>
    &#x1F596; <br>
    &#x1F913; <br>
    </p>
</body>
</html>
