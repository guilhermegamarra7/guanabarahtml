<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino com Imagens</title>
</head>
<body>
    <h1>Imagem Dinâmica</h1>
    <p>Tente abrir este site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho da tela.</p>
    <picture>
        <source media="(min-width: 751px) and (max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <source media="(min-width: 1051px)" srcset="imagens/foto-g.png" type="image/png">
        <img src="imagens/foto-p.png" alt="Imagem Flexível">
    </picture>
    <h1>Estudo de áudio</h1>
    <p>Reprodução de áudios em HTML5</p>
    <audio preload="metadata" autoplay controls>
        <source src="midia/outside.mp3" type="audio/mpeg">
        <source src="midia/outside.ogg" type="audio/ogg">
        <source src="midia/outside.wav" type="audio/wav">
        <p>Infelizmente, seu navegador não consegue reproduzir áudio. <a href="midia/outside.mp3"> Clique aqui para baixar oa rquivo MP3.</a></p>
    </audio>
</body>
</html>
